<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Interview Practice</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3347;
  --text:#e4e4e7;--text-dim:#9ca3af;--text-muted:#6b7280;
  --accent:#6366f1;--accent-hover:#818cf8;--accent-dim:#4f46e5;
  --red:#ef4444;--green:#22c55e;--yellow:#eab308;--orange:#f97316;
  --blue:#3b82f6;
}
html{font-size:15px}
body{font-family:'SF Mono',SFMono-Regular,ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

/* Layout */
.app{max-width:900px;margin:0 auto;padding:1.5rem}
.hidden{display:none!important}

/* Header */
.header{border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:2rem}
.header h1{font-size:1.1rem;font-weight:600;color:var(--text);letter-spacing:-.02em}
.header p{font-size:.8rem;color:var(--text-muted);margin-top:.25rem}

/* Screen titles */
.screen-title{font-size:1rem;font-weight:600;margin-bottom:1.5rem;color:var(--text)}

/* Setup Screen */
.setup-section{margin-bottom:1.5rem}
.setup-section label{display:block;font-size:.75rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;font-weight:600}
.option-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem}
.option-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);padding:.6rem .8rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.8rem;transition:all .15s;text-align:left}
.option-btn:hover{border-color:var(--accent);color:var(--text)}
.option-btn.selected{border-color:var(--accent);background:var(--accent-dim);color:#fff}
.option-btn .opt-sub{display:block;font-size:.7rem;color:var(--text-muted);margin-top:.15rem}
.option-btn.selected .opt-sub{color:rgba(255,255,255,.7)}

/* Persona selector */
.persona-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.5rem}
.persona-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);padding:.6rem .8rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.8rem;transition:all .15s;text-align:left}
.persona-btn:hover{border-color:var(--accent);color:var(--text)}
.persona-btn.selected{border-color:var(--accent);background:var(--accent-dim);color:#fff}
.persona-btn .persona-name{font-weight:600;color:var(--text)}
.persona-btn.selected .persona-name{color:#fff}
.persona-btn .persona-desc{font-size:.7rem;color:var(--text-muted);margin-top:.15rem}
.persona-btn.selected .persona-desc{color:rgba(255,255,255,.7)}

/* Toggle */
.toggle-row{display:flex;align-items:center;gap:.75rem;margin-top:.5rem}
.toggle{width:40px;height:22px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;cursor:pointer;position:relative;transition:all .2s}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(18px)}
.toggle-label{font-size:.8rem;color:var(--text-dim)}

/* Start button */
.start-btn{background:var(--accent);color:#fff;border:none;padding:.75rem 2rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:600;margin-top:1rem;transition:all .15s;width:100%}
.start-btn:hover{background:var(--accent-hover)}
.start-btn:disabled{opacity:.4;cursor:not-allowed}

/* Interview Screen */
.interview-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1px solid var(--border)}
.interview-meta{font-size:.75rem;color:var(--text-muted)}
.interview-meta span{margin-right:1rem}
.timer{font-size:.8rem;font-weight:600;color:var(--text-dim);font-variant-numeric:tabular-nums}
.timer.warning{color:var(--orange)}
.timer.critical{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.chat-area{height:calc(100vh - 320px);min-height:300px;overflow-y:auto;padding-right:.5rem;margin-bottom:1rem}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-track{background:transparent}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg{margin-bottom:1rem;max-width:85%}
.msg.interviewer{margin-right:auto}
.msg.candidate{margin-left:auto}
.msg-sender{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25rem}
.msg.interviewer .msg-sender{color:var(--accent)}
.msg.candidate .msg-sender{color:var(--green)}
.msg-body{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;font-size:.85rem;line-height:1.6;color:var(--text)}
.msg.candidate .msg-body{background:var(--surface2);border-color:var(--border)}
.msg-body .pushback{color:var(--orange);font-style:italic}
.msg-body .interrupt{color:var(--red);font-weight:600}
.msg-time{font-size:.65rem;color:var(--text-muted);margin-top:.2rem}
.msg.candidate .msg-time{text-align:right}

.typing-indicator{display:flex;gap:4px;padding:.5rem 0}
.typing-indicator span{width:6px;height:6px;background:var(--text-muted);border-radius:50%;animation:bounce .6s infinite alternate}
.typing-indicator span:nth-child(2){animation-delay:.15s}
.typing-indicator span:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{transform:translateY(-6px);opacity:.3}}

.input-area{display:flex;gap:.5rem;align-items:flex-end}
.input-area textarea{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.75rem;border-radius:6px;font-family:inherit;font-size:.85rem;resize:none;min-height:44px;max-height:160px;line-height:1.5;transition:border-color .15s}
.input-area textarea:focus{outline:none;border-color:var(--accent)}
.input-area textarea::placeholder{color:var(--text-muted)}
.send-btn{background:var(--accent);color:#fff;border:none;width:44px;height:44px;border-radius:6px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.send-btn:hover{background:var(--accent-hover)}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
.end-btn{background:var(--red);color:#fff;border:none;padding:.5rem 1rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.75rem;font-weight:600;transition:all .15s}
.end-btn:hover{opacity:.8}

/* Evaluation Screen */
.eval-section{margin-bottom:2rem}
.eval-section h2{font-size:.9rem;font-weight:600;margin-bottom:1rem;color:var(--text);padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.score-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem}
.score-card .dim-name{font-size:.8rem;font-weight:600;color:var(--text);margin-bottom:.5rem}
.score-bar-track{height:6px;background:var(--surface2);border-radius:3px;margin-bottom:.35rem;overflow:hidden}
.score-bar-fill{height:100%;border-radius:3px;transition:width .8s ease}
.score-bar-fill.s1{background:var(--red);width:20%}
.score-bar-fill.s2{background:var(--orange);width:40%}
.score-bar-fill.s3{background:var(--yellow);width:60%}
.score-bar-fill.s4{background:var(--blue);width:80%}
.score-bar-fill.s5{background:var(--green);width:100%}
.score-val{font-size:.75rem;color:var(--text-dim)}
.score-comment{font-size:.75rem;color:var(--text-muted);margin-top:.35rem;line-height:1.5}

.signals{margin-top:.75rem}
.signal{padding:.6rem .8rem;border-radius:6px;margin-bottom:.5rem;font-size:.8rem;line-height:1.5}
.signal.strong{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:var(--green)}
.signal.weak{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--red)}

.advice-list{list-style:none}
.advice-list li{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.75rem 1rem;margin-bottom:.5rem;font-size:.8rem;line-height:1.6;color:var(--text-dim)}
.advice-list li strong{color:var(--text)}

.overall-score{text-align:center;padding:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:2rem}
.overall-score .big-score{font-size:2.5rem;font-weight:700;color:var(--accent)}
.overall-score .score-label{font-size:.8rem;color:var(--text-muted);margin-top:.25rem}
.overall-score .verdict{font-size:.85rem;color:var(--text);margin-top:.5rem;font-weight:600}

/* Review transcript */
.transcript-entry{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:.75rem}
.transcript-entry .te-role{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25rem}
.transcript-entry .te-role.interviewer{color:var(--accent)}
.transcript-entry .te-role.candidate{color:var(--green)}
.transcript-entry .te-text{font-size:.8rem;color:var(--text-dim);line-height:1.6}
.transcript-entry .te-annotation{font-size:.75rem;color:var(--orange);margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--border);font-style:italic}

.btn-row{display:flex;gap:.75rem;margin-top:1.5rem}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.6rem 1.2rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.8rem;transition:all .15s}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border:none;padding:.6rem 1.2rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.8rem;font-weight:600;transition:all .15s}
.btn-primary:hover{background:var(--accent-hover)}

/* Responsive */
@media(max-width:600px){
  .app{padding:1rem}
  .score-grid{grid-template-columns:1fr}
  .option-grid{grid-template-columns:1fr 1fr}
  .msg{max-width:95%}
  .chat-area{height:calc(100vh - 280px)}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>PM Interview Practice</h1>
    <p>Realistic mock interviews. No hand-holding.</p>
  </div>

  <!-- SETUP SCREEN -->
  <div id="setup-screen">
    <div class="screen-title">Configure Your Interview</div>

    <div class="setup-section">
      <label>Company Type</label>
      <div class="option-grid" data-group="company">
        <button class="option-btn" data-value="bigtech">Big Tech<span class="opt-sub">FAANG-style, structured</span></button>
        <button class="option-btn" data-value="fintech">Fintech<span class="opt-sub">Regulated, metrics-heavy</span></button>
        <button class="option-btn" data-value="startup">Startup<span class="opt-sub">Scrappy, ambiguity-heavy</span></button>
      </div>
    </div>

    <div class="setup-section">
      <label>Seniority Level</label>
      <div class="option-grid" data-group="seniority">
        <button class="option-btn" data-value="associate">Associate PM<span class="opt-sub">Entry-level</span></button>
        <button class="option-btn" data-value="pm">Product Manager<span class="opt-sub">Mid-level</span></button>
        <button class="option-btn" data-value="senior">Senior PM<span class="opt-sub">Experienced</span></button>
        <button class="option-btn" data-value="group">Group PM<span class="opt-sub">Leadership</span></button>
      </div>
    </div>

    <div class="setup-section">
      <label>Interview Type</label>
      <div class="option-grid" data-group="type">
        <button class="option-btn" data-value="product_sense">Product Sense<span class="opt-sub">Design & strategy</span></button>
        <button class="option-btn" data-value="metrics">Metrics<span class="opt-sub">Analytics & data</span></button>
        <button class="option-btn" data-value="execution">Execution<span class="opt-sub">Roadmap & delivery</span></button>
        <button class="option-btn" data-value="behavioral">Behavioral<span class="opt-sub">Culture & leadership</span></button>
        <button class="option-btn" data-value="technical">Technical<span class="opt-sub">Eng collaboration</span></button>
        <button class="option-btn" data-value="mixed">Mixed<span class="opt-sub">All dimensions</span></button>
      </div>
    </div>

    <div class="setup-section">
      <label>Interviewer Persona</label>
      <div class="persona-grid" data-group="persona">
        <button class="persona-btn selected" data-value="neutral"><span class="persona-name">Neutral PM Lead</span><span class="persona-desc">Balanced, methodical evaluation</span></button>
        <button class="persona-btn" data-value="skeptical_eng"><span class="persona-name">Skeptical Engineer</span><span class="persona-desc">Challenges feasibility, digs into details</span></button>
        <button class="persona-btn" data-value="business_leader"><span class="persona-name">Business Leader</span><span class="persona-desc">Revenue-focused, ROI-driven</span></button>
        <button class="persona-btn" data-value="user_advocate"><span class="persona-name">User Advocate</span><span class="persona-desc">Empathy-first, questions assumptions</span></button>
      </div>
    </div>

    <div class="setup-section">
      <label>Options</label>
      <div class="toggle-row">
        <div class="toggle" id="stress-toggle" onclick="this.classList.toggle('on')"></div>
        <span class="toggle-label">Stress Mode — more interruptions, tighter time pressure</span>
      </div>
    </div>

    <button class="start-btn" id="start-btn" disabled>Start Interview</button>
  </div>

  <!-- INTERVIEW SCREEN -->
  <div id="interview-screen" class="hidden">
    <div class="interview-header">
      <div class="interview-meta">
        <span id="meta-company"></span>
        <span id="meta-seniority"></span>
        <span id="meta-type"></span>
        <span id="meta-persona"></span>
      </div>
      <div style="display:flex;align-items:center;gap:.75rem">
        <div class="timer" id="timer">45:00</div>
        <button class="end-btn" id="end-btn">End Interview</button>
      </div>
    </div>
    <div class="chat-area" id="chat-area"></div>
    <div class="input-area">
      <textarea id="user-input" placeholder="Type your answer..." rows="1"></textarea>
      <button class="send-btn" id="send-btn">&#9654;</button>
    </div>
  </div>

  <!-- EVALUATION SCREEN -->
  <div id="eval-screen" class="hidden">
    <div class="screen-title">Interview Evaluation</div>
    <div class="overall-score" id="overall-score"></div>
    <div class="eval-section">
      <h2>Dimension Scores</h2>
      <div class="score-grid" id="score-grid"></div>
    </div>
    <div class="eval-section">
      <h2>Strong Signals</h2>
      <div class="signals" id="strong-signals"></div>
    </div>
    <div class="eval-section">
      <h2>Weak Signals</h2>
      <div class="signals" id="weak-signals"></div>
    </div>
    <div class="eval-section">
      <h2>Actionable Advice</h2>
      <ul class="advice-list" id="advice-list"></ul>
    </div>
    <div class="eval-section">
      <h2>Transcript Review</h2>
      <div id="transcript-review"></div>
    </div>
    <div class="btn-row">
      <button class="btn-secondary" id="new-interview-btn">New Interview</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// PM INTERVIEW PRACTICE - CORE APPLICATION
// ============================================================

const APP = {
  config: { company: null, seniority: null, type: null, persona: 'neutral', stressMode: false },
  state: {
    screen: 'setup',
    transcript: [],
    questionIndex: 0,
    followUpCount: 0,
    maxFollowUps: 0,
    timerSeconds: 0,
    timerInterval: null,
    interviewStarted: false,
    interviewEnded: false,
    currentQuestion: null,
    candidateScores: { problem_framing:[], depth:[], structure:[], tradeoffs:[], metrics:[], execution:[] },
    difficultyLevel: 2,
    totalExchanges: 0,
    questionHistory: [],
    usedQuestionKeys: new Set()
  }
};

// ============================================================
// DYNAMIC QUESTION GENERATOR
// Combinatorial system: products x scenarios x twists x company context
// Produces hundreds of unique questions per interview type
// ============================================================

const Q_PARTS = {
  // ---- PRODUCT SENSE ----
  product_sense: {
    bigtech: {
      products: ["Gmail","YouTube","Google Maps","Google Photos","Chrome","Android","Google Drive","Google Meet","Google Classroom","Google Pay","Apple Music","iMessage","WhatsApp","Instagram","Facebook Marketplace","Amazon Prime Video","Alexa","Kindle","LinkedIn","Spotify","Netflix","Uber","Airbnb","Slack","Zoom","Twitter/X","Reddit","Pinterest","Snapchat","Discord"],
      scenarios: [
        "DAU has plateaued for 2 quarters. Propose a strategy to reignite growth.",
        "is losing users in the 18-24 age group. How would you approach this?",
        "wants to expand into a new user segment it hasn't served before. Design the approach.",
        "needs a 0-to-1 feature that differentiates it from competitors. What would you build and why?",
        "has strong engagement but weak monetization. How would you close that gap?",
        "users are complaining about a core workflow being too complex. Redesign it.",
        "is considering entering an adjacent market. How do you evaluate whether to do it?",
        "has a feature that 80% of users ignore. Should you kill it, redesign it, or double down?",
        "needs to improve retention for users who signed up in the last 30 days. What's your plan?",
        "wants to build a social or community layer. Design the product strategy.",
        "is launching in a new international market with very different user behaviors. Adapt the product.",
        "has a power user segment that generates 60% of content but only 5% of revenue. What do you do?",
        "needs to balance creator experience with consumer experience. How do you prioritize?"
      ],
      twists: [
        "","",
        " Your main competitor just launched a similar initiative last week.",
        " Budget has been cut by 40% due to company-wide cost reductions.",
        " The CEO is personally invested in a different direction. How do you navigate this?",
        " You have data showing the obvious solution doesn't work. What's your contrarian take?",
        " You need to show measurable impact within 6 weeks."
      ]
    },
    fintech: {
      products: ["a neobank app","a payments platform","a lending product","a crypto exchange","a personal finance dashboard","a B2B invoicing tool","an expense management platform","a buy-now-pay-later product","a wealth management app","an insurance comparison platform","a cross-border remittance service","a merchant POS system","a payroll platform for SMBs"],
      scenarios: [
        "Design a new savings feature that drives daily engagement.",
        "needs to onboard users who have never used digital banking before. Design the experience.",
        "is seeing high drop-off at the KYC step. How would you fix this while maintaining compliance?",
        "wants to launch a credit product for users with thin credit files. Walk me through the design.",
        "is expanding from consumer to SMB. What's your product strategy?",
        "has strong acquisition but users become dormant after 60 days. Diagnose and fix.",
        "needs to differentiate from 5 competitors with nearly identical feature sets. What's your approach?",
        "wants to build trust with users who are skeptical of digital finance. Design for trust.",
        "is entering a market with strict new regulations coming in 6 months. How do you plan?",
        "wants to reduce fraud without adding friction to the user experience. Design the trade-offs."
      ],
      twists: [
        "","",
        " A regulatory change just made your core approach potentially non-compliant.",
        " Your largest partner bank just ended their contract.",
        " A security breach at a competitor has made users across the industry nervous."
      ]
    },
    startup: {
      products: ["a remote team collaboration tool","a marketplace for freelancers","an AI writing assistant","a health & wellness app","a developer tools platform","an e-commerce enablement tool","a PropTech rental platform","an EdTech tutoring marketplace","a food delivery for rural areas","a fleet management SaaS","a creator monetization platform","a climate tech carbon tracker","a mental health therapy platform"],
      scenarios: [
        "You have 500 users and flat growth. The board wants a plan. What do you do in the next 30 days?",
        "just raised Series A. The founder wants to build 10 features. You can only ship 2. How do you decide?",
        "has no supply and no demand. Solve the cold-start problem.",
        "is losing a feature war to a well-funded competitor. Your team is 5 people. What's your strategy?",
        "has strong product-market fit signals but can't figure out monetization. What do you propose?",
        "users love the product but won't pay. Free-to-paid conversion is 0.5%. Fix it.",
        "has a vocal minority of users requesting enterprise features. Should you pivot?",
        "needs to decide between going deep in one vertical or expanding horizontally. Frame the decision.",
        "just lost its biggest customer representing 30% of revenue. What do you do this week?",
        "has 6 months of runway. Define your product strategy to reach the next funding milestone."
      ],
      twists: [
        "","",
        " Your co-founder disagrees with your direction.",
        " Your only designer just left the company.",
        " A YC startup just launched with an identical value proposition."
      ]
    }
  },

  // ---- METRICS ----
  metrics: {
    bigtech: {
      stems: [
        "You're PM for {product}. Define the complete success metrics framework.",
        "{product}'s {metric} dropped {pct}% week over week. Diagnose this.",
        "You're running an A/B test on {product}. {metric_a} is up {pct}% but {metric_b} is down. Interpret these results and decide what to ship.",
        "Define the north star metric for {product}'s new {feature}. What are the input metrics that drive it?",
        "{product} launched a new feature last month. How would you design the experiment to measure its impact?",
        "The VP wants to increase {metric} for {product} by 20% this quarter. Build the metrics tree and identify levers.",
        "Two teams at the company are optimizing for conflicting metrics on {product}. How do you resolve this?",
        "You suspect {product}'s reported {metric} is inflated by bot activity. How do you investigate?",
        "{product} has great engagement metrics but user satisfaction surveys show declining happiness. Explain the disconnect.",
        "Design a metrics framework that balances short-term engagement with long-term user health for {product}."
      ],
      products: ["YouTube Shorts","Google Search","Gmail","Google Maps","Chrome","Facebook News Feed","Instagram Reels","WhatsApp Business","Amazon Prime","Spotify","Netflix","Uber","Airbnb","LinkedIn Feed","Twitter/X"],
      metrics: ["click-through rate","daily active users","session duration","retention rate","conversion rate","revenue per user","ad impressions","time-to-first-action","7-day retention","NPS score"],
      metrics_b: ["time-to-first-share","new user activation","content diversity","creator satisfaction","page load time","customer support tickets"],
      features: ["AI-powered recommendation engine","social sharing feature","personalization layer","premium subscription tier","creator tools suite","search redesign"],
      pcts: ["5","8","12","15","20","3"]
    },
    fintech: {
      stems: [
        "You're PM at a payments company. Define success metrics for a new {feature}.",
        "Your lending product's default rate spiked to {pct}%. Revenue is up. Is this good or bad?",
        "Design an experiment to test whether {feature} increases user retention.",
        "Your {metric} dropped {pct}% after a product change. How do you investigate?",
        "Define the metrics framework for a new {feature} targeting {segment}.",
        "You need to balance fraud prevention metrics against user experience metrics. Frame the trade-offs.",
        "Your funnel shows 70% drop-off between sign-up and first transaction. Break down the metrics to diagnose why.",
        "A competitor claims 3x your {metric}. How do you validate their claim and benchmark yourself?"
      ],
      features: ["instant transfer feature","savings round-up tool","credit score monitoring","merchant analytics dashboard","recurring payments system","split payments feature","budgeting assistant","cashback rewards program"],

// Dynamic question generator
function generateQuestion(type, company, seniority) {
  const seniorityDepth = { associate:'mid', pm:'mid', senior:'senior', group:'senior' };
  const depth = seniorityDepth[seniority] || 'mid';

  if (type === 'behavioral') {
    return generateBehavioral(company, depth);
  }

  const bank = Q_PARTS[type];
  if (!bank) return null;
  const companyBank = bank[company];
  if (!companyBank) return null;

  if (companyBank.stems) {
    return generateFromStems(companyBank, type, depth);
  } else if (companyBank.products) {
    return generateProductSense(companyBank, type, depth);
  }
  return null;
}

function generateProductSense(bank, type, depth) {
  const product = pickRandom(bank.products);
  const scenario = pickRandom(bank.scenarios);
  const twist = pickRandom(bank.twists);
  const q = `You're building ${product}. ${product} ${scenario}${twist}`;
  return { q, topics:[type], depth };
}

function generateFromStems(bank, type, depth) {
  const stem = pickRandom(bank.stems);
  let q = stem;

  // Replace all template variables
  const replacements = {
    '{product}': bank.products,
    '{feature}': bank.features,
    '{metric}': bank.metrics,
    '{metric_a}': bank.metrics,
    '{metric_b}': bank.metrics_b || bank.metrics,
    '{pct}': bank.pcts,
    '{team_size}': bank.team_sizes,
    '{system}': bank.systems,
    '{option_a}': bank.option_as,
    '{option_b}': bank.option_bs,
    '{segment}': bank.segments,
    '{months}': bank.months,
    '{weeks}': bank.weeks,
    '{time}': bank.times,
    '{users}': bank.users,
    '{mult}': bank.mults,
    '{event}': bank.events,
  };

  Object.entries(replacements).forEach(([key, arr]) => {
    if (arr && q.includes(key)) {
      q = q.replace(key, pickRandom(arr));
    }
  });

  return { q, topics:[type], depth };
}

function generateBehavioral(company, depth) {
  let pool = [...Q_PARTS.behavioral.all];
  if (company === 'fintech') pool = pool.concat(Q_PARTS.behavioral.fintech_extra);
  if (company === 'startup') pool = pool.concat(Q_PARTS.behavioral.startup_extra);
  const q = pickRandom(pool);
  return { q, topics:['behavioral'], depth };
}

// Detects if a candidate message is a clarifying question
function detectClarifyingQuestion(text) {
  const lower = text.toLowerCase();
  const questionMarks = (text.match(/\?/g) || []).length;
  const words = lower.split(/\s+/);
  const wordCount = words.length;

  // Strong question signals
  const questionStarts = /^(can |could |should |would |is |are |do |does |what |who |where |when |why |how |which |just to clarify|before i |to clarify|quick question|let me clarify|i want to understand|can you tell|could you clarify|may i ask)/i;
  const questionPhrases = /(can you (tell|clarify|explain|share|give)|could you (clarify|help me understand)|what (is|are|do|does|would|should)|who (is|are)|how (many|much|long|do|does|would|should|is)|are we (talking|looking|assuming|considering)|is (this|that|there|it)|should i (assume|consider|focus|think)|do (we|i|you) (have|know|need|want)|what('s| is| are) the (scope|goal|target|timeline|budget|constraint|metric|user|audience|market|priority)|are there (any |specific )?(constraints|requirements|limitations|guidelines)|which (market|segment|user|region|platform|metric)|how (big|large|small|broad|narrow)|what kind of|when you say|by .+ do you mean)/i;
  const clarifyingIntents = /(before i (dive in|start|answer|proceed|begin)|just to (make sure|confirm|clarify|understand)|i (want|need) to (clarify|understand|confirm|ask)|few (questions|clarifications|things) before|let me (ask|clarify|understand)|couple of questions)/i;

  const hasQuestionMark = questionMarks > 0;
  const startsLikeQuestion = questionStarts.test(lower);
  const hasQuestionPhrase = questionPhrases.test(lower);
  const hasClarifyingIntent = clarifyingIntents.test(lower);

  // If it's a long answer with a question tacked on, it's probably not primarily a clarification
  if (wordCount > 120 && questionMarks <= 1) return null;

  // Score the likelihood this is a clarifying question
  let score = 0;
  if (hasQuestionMark) score += 2;
  if (startsLikeQuestion) score += 3;
  if (hasQuestionPhrase) score += 3;
  if (hasClarifyingIntent) score += 4;
  if (wordCount < 50 && hasQuestionMark) score += 1;

  if (score < 3) return null;

  // Determine what they're asking about
  if (/who.*(user|customer|audience|persona|target|demographic|segment)|target (user|audience|market|customer|segment)|user (base|segment|group)|for whom/i.test(lower)) return 'users';
  if (/metric|measure|success|kpi|north star|how.*(know|measure|track|define success)|what.*(success|goal) look/i.test(lower)) return 'metrics_clarity';
  if (/scope|broad|narrow|focus|limit|boundary|how (big|wide|broad|narrow)|what part/i.test(lower)) return 'scope';
  if (/team|engineer|resource|staff|people|headcount|budget|how many (people|engineers|designers)/i.test(lower)) return 'constraints';
  if (/timeline|deadline|time.?(frame|line|horizon)|how (long|much time)|when.*ship|quarter|month|week|launch date/i.test(lower)) return 'timeline';
  if (/market|competitor|competitive|landscape|geography|region|country|global|domestic|international/i.test(lower)) return 'market';
  if (/technical|tech stack|infrastructure|platform|system|architecture|api|backend|database|legacy/i.test(lower)) return 'technical';
  if (/geography|region|country|countries|location|local|global|international|domestic|us|india|europe/i.test(lower)) return 'geography';
  if (/revenue|monetiz|business model|pricing|cost|profit|margin|subscription|freemium|paid|free tier/i.test(lower)) return 'business';

  return 'general';
}

  { key:"structure", name:"Structured Communication", desc:"Organized, logical flow with clear frameworks applied appropriately" },
  { key:"tradeoffs", name:"Trade-off Awareness", desc:"Identifying and articulating costs, risks, and alternatives" },
  { key:"metrics", name:"Metrics Thinking", desc:"Defining measurable success criteria and using data in reasoning" },
  { key:"execution", name:"Execution Realism", desc:"Practical, achievable plans grounded in real-world constraints" }
];

// ============================================================
// INTERVIEW CONTROLLER
// ============================================================

function startInterview() {
  APP.config.stressMode = document.getElementById('stress-toggle').classList.contains('on');

  // Set timing
  const baseMins = APP.config.stressMode ? 30 : 45;
  APP.state.timerSeconds = baseMins * 60;
  APP.state.maxFollowUps = APP.config.stressMode ? 2 : 3;

  // Show interview screen
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('interview-screen').classList.remove('hidden');

  // Set meta
  const labels = {
    bigtech:'Big Tech', fintech:'Fintech', startup:'Startup',
    associate:'Associate PM', pm:'Product Manager', senior:'Senior PM', group:'Group PM',
    product_sense:'Product Sense', metrics:'Metrics & Analytics', execution:'Execution',
    behavioral:'Behavioral', technical:'Technical', mixed:'Mixed'
  };
  document.getElementById('meta-company').textContent = labels[APP.config.company];
  document.getElementById('meta-seniority').textContent = labels[APP.config.seniority];
  document.getElementById('meta-type').textContent = labels[APP.config.type];
  document.getElementById('meta-persona').textContent = PERSONAS[APP.config.persona].name;

  // Start timer
  updateTimerDisplay();
  APP.state.timerInterval = setInterval(tickTimer, 1000);

  // Opening
  APP.state.interviewStarted = true;
  const persona = PERSONAS[APP.config.persona];
  const openings = {
    neutral: `Good. Let's get started. I'll be conducting a ${labels[APP.config.type].toLowerCase()} interview. I'll ask questions, and I expect structured, specific answers. I may push back or ask follow-ups. Ready?`,
    skeptical_eng: `Alright. I'm coming from the engineering side, so I'll be particularly interested in feasibility and technical grounding. Don't hand-wave past implementation details. Let's begin.`,
    business_leader: `Let's jump in. I care about impact — revenue, growth, margins. Make sure everything you propose connects to business outcomes. Let's go.`,
    user_advocate: `Let's start. I'm going to be focused on the user throughout this conversation. If you can't explain who benefits and why, we have a problem. Ready?`
  };

  addMessage('interviewer', openings[APP.config.persona]);

  setTimeout(() => {
    askNextQuestion();
  }, 1500);
}

function tickTimer() {
  APP.state.timerSeconds--;
  updateTimerDisplay();

  // Time pressure messages
  const mins = Math.floor(APP.state.timerSeconds / 60);
  const timerEl = document.getElementById('timer');

  if (mins <= 5 && mins > 2) {
    timerEl.className = 'timer warning';
    if (mins === 5 && APP.state.timerSeconds % 60 === 0 && !APP.state._warned5) {
      APP.state._warned5 = true;
      if (APP.state.transcript.length > 2) {
        addMessage('interviewer', pickRandom(FOLLOWUPS.time_pressure));
      }
    }
  } else if (mins <= 2) {
    timerEl.className = 'timer critical';
    if (mins === 2 && APP.state.timerSeconds % 60 === 0 && !APP.state._warned2) {
      APP.state._warned2 = true;
      addMessage('interviewer', "Two minutes left. Give me your final recommendation.");
    }
  }

  if (APP.state.timerSeconds <= 0) {
    endInterview();
  }
}

function updateTimerDisplay() {
  const m = Math.floor(APP.state.timerSeconds / 60);
  const s = APP.state.timerSeconds % 60;
  document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function pickQuestion() {
  const type = APP.config.type;
  const company = APP.config.company;
  const seniority = APP.config.seniority;

  // For mixed interviews, rotate through types
  const mixedTypes = ['product_sense','metrics','execution','behavioral','technical'];
  const effectiveType = (type === 'mixed')
    ? mixedTypes[APP.state.questionIndex % mixedTypes.length]
    : type;

  // Generate a fresh unique question (retry up to 10 times to avoid duplicates)
  for (let i = 0; i < 10; i++) {
    const q = generateQuestion(effectiveType, company, seniority);
    if (q && !APP.state.usedQuestionKeys.has(q.q)) {
      APP.state.usedQuestionKeys.add(q.q);
      return { ...q, _type: effectiveType };
    }
  }

  // Fallback: just generate one even if somehow duplicate
  const q = generateQuestion(effectiveType, company, seniority);
  return q ? { ...q, _type: effectiveType } : null;
}

function askNextQuestion() {
  const q = pickQuestion();
  if (!q) {
    endInterview();
    return;
  }
  APP.state.currentQuestion = q;
  APP.state.followUpCount = 0;
  APP.state.questionIndex++;
  APP.state.questionHistory.push(q);
  addMessage('interviewer', q.q);
}

function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text || APP.state.interviewEnded) return;

  input.value = '';
  input.style.height = 'auto';
  addMessage('candidate', text);
  APP.state.totalExchanges++;

  // Disable input while "thinking"
  input.disabled = true;
  document.getElementById('send-btn').disabled = true;

  // Show typing indicator
  showTyping();

  // Analyze and respond
  const delay = 800 + Math.random() * 1200;
  setTimeout(() => {
    hideTyping();
    input.disabled = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
    processResponse(text);
  }, delay);
}

function processResponse(answer) {
  if (APP.state.interviewEnded) return;

  // --- Check if the candidate is asking a clarifying question ---
  const clarifyType = detectClarifyingQuestion(answer);
  if (clarifyType) {
    // Track that they asked a clarification (positive signal for problem_framing)
    if (!APP.state._clarificationCount) APP.state._clarificationCount = 0;
    APP.state._clarificationCount++;
    // Give a small bonus for good clarifying behavior (up to 3 times)
    if (APP.state._clarificationCount <= 3) {
      APP.state.candidateScores.problem_framing.push(4);
    }

    const ack = pickRandom(FOLLOWUPS.clarification_acknowledged);
    const detail = pickRandom(CLARIFICATIONS[clarifyType] || CLARIFICATIONS.general);

    // In stress mode, sometimes push them to just make assumptions
    if (APP.config.stressMode && Math.random() < 0.4) {
      addMessage('interviewer', "I'm not going to give you all the constraints upfront. Make an assumption, state it, and move forward. That's what we do in the real world.");
      return;
    }

    addMessage('interviewer', ack + " " + detail);
    return;
  }

  const analysis = analyzeAnswer(answer);
  const persona = PERSONAS[APP.config.persona];
  const stressMult = APP.config.stressMode ? 1.6 : 1;

  // Record scores
  Object.keys(analysis.scores).forEach(k => {
    if (APP.state.candidateScores[k]) {
      APP.state.candidateScores[k].push(analysis.scores[k]);
    }
  });

  // Decide response type
  const roll = Math.random();
  const followUpBudget = APP.state.maxFollowUps;
  const canFollowUp = APP.state.followUpCount < followUpBudget;

  // Should we interrupt / pushback?
  if (analysis.isVague && canFollowUp) {
    APP.state.followUpCount++;
    addMessage('interviewer', pickRandom(FOLLOWUPS.vague));
    return;
  }

  if (roll < persona.pushbackRate * stressMult && analysis.hasWeakAssumption && canFollowUp) {
    APP.state.followUpCount++;
    addMessage('interviewer', pickRandom(FOLLOWUPS.pushback));
    return;
  }

  if (analysis.missingMetrics && canFollowUp && roll < 0.6) {
    APP.state.followUpCount++;
    addMessage('interviewer', pickRandom(FOLLOWUPS.metrics));
    return;
  }

  if (analysis.missingTradeoffs && canFollowUp && roll < 0.5) {
    APP.state.followUpCount++;
    addMessage('interviewer', pickRandom(FOLLOWUPS.tradeoffs));
    return;
  }

  // Persona-specific follow-ups
  if (canFollowUp && roll < 0.4) {
    const biasType = pickRandom(persona.biases);
    if (FOLLOWUPS[biasType]) {
      APP.state.followUpCount++;
      addMessage('interviewer', pickRandom(FOLLOWUPS[biasType]));
      return;
    }
  }

  // Depth follow-up
  if (analysis.isShallow && canFollowUp) {
    APP.state.followUpCount++;
    addMessage('interviewer', pickRandom(FOLLOWUPS.depth));
    return;
  }

  // Add constraint mid-answer sometimes
  if (roll < persona.constraintRate * stressMult && canFollowUp) {
    APP.state.followUpCount++;
    addMessage('interviewer', pickRandom(FOLLOWUPS.constraint));
    return;
  }

  // Why follow-up
  if (canFollowUp && roll < 0.3) {
    APP.state.followUpCount++;
    addMessage('interviewer', pickRandom(FOLLOWUPS.why));
    return;
  }

  // Move to next question
  const transitions = [
    "Alright. Let's move on.",
    "Understood. Next question.",
    "Noted. Moving forward.",
    "Let's shift gears.",
    "Okay. Different topic."
  ];

  // Adaptive difficulty
  const avgScore = Object.values(analysis.scores).reduce((a,b)=>a+b,0) / Object.values(analysis.scores).length;
  if (avgScore >= 4) APP.state.difficultyLevel = Math.min(5, APP.state.difficultyLevel + 0.5);
  else if (avgScore <= 2) APP.state.difficultyLevel = Math.max(1, APP.state.difficultyLevel - 0.3);

  // Check if we should end (enough questions asked)
  if (APP.state.questionIndex >= 4 && APP.state.timerSeconds < APP.state.timerSeconds * 0.3) {
    endInterview();
    return;
  }

  addMessage('interviewer', pickRandom(transitions));
  setTimeout(() => askNextQuestion(), 1000);
}

function analyzeAnswer(text) {
  const words = text.split(/\s+/).length;
  const sentences = text.split(/[.!?]+/).filter(s => s.trim()).length;

  // Heuristic analysis
  const hasFramework = /first|second|third|framework|approach|step|phase|pillar|dimension|bucket|category/i.test(text);
  const hasMetrics = /metric|measure|kpi|conversion|retention|revenue|dau|mau|nps|engagement|funnel|rate|percentage|growth|churn|ltv|arpu|cac/i.test(text);
  const hasTradeoffs = /trade.?off|downside|risk|cost|however|alternatively|on the other hand|versus|vs\.|con(s)?|drawback|sacrifice|compromise/i.test(text);
  const hasUserFocus = /user|customer|persona|need|pain point|problem|experience|journey|empathy|research|interview/i.test(text);
  const hasSpecifics = /for example|specifically|concretely|such as|like when|in practice|for instance/i.test(text);
  const hasData = /data|experiment|a\/b test|hypothesis|statistical|sample|cohort|segment|analysis/i.test(text);
  const hasPrioritization = /prioriti|impact|effort|ice|rice|moscow|must.?have|nice.?to.?have|p0|p1|urgent|important/i.test(text);
  const hasTechnical = /api|database|backend|frontend|infrastructure|scalab|latency|cache|architecture|system|microservice|endpoint/i.test(text);

  const isVague = words < 30 && !hasSpecifics;
  const isShallow = words < 60 && !hasFramework && !hasSpecifics;
  const hasWeakAssumption = !hasData && !hasUserFocus && words > 40;
  const missingMetrics = !hasMetrics && words > 50;
  const missingTradeoffs = !hasTradeoffs && words > 60;

  // Score calculation
  const scores = {};

  // Problem framing
  scores.problem_framing = 2;
  if (hasFramework) scores.problem_framing += 1;
  if (hasUserFocus) scores.problem_framing += 1;
  if (words > 80 && hasSpecifics) scores.problem_framing += 1;
  scores.problem_framing = Math.min(5, scores.problem_framing);

  // Depth
  scores.depth = 2;
  if (hasSpecifics) scores.depth += 1;
  if (words > 100) scores.depth += 0.5;
  if (hasData) scores.depth += 0.5;
  if (hasTechnical) scores.depth += 0.5;
  if (!isShallow) scores.depth += 0.5;
  scores.depth = Math.min(5, Math.round(scores.depth));

  // Structure
  scores.structure = 2;
  if (hasFramework) scores.structure += 1.5;
  if (sentences >= 4) scores.structure += 0.5;
  if (hasPrioritization) scores.structure += 0.5;
  if (words > 60 && words < 300) scores.structure += 0.5;
  scores.structure = Math.min(5, Math.round(scores.structure));

  // Tradeoffs
  scores.tradeoffs = 1.5;
  if (hasTradeoffs) scores.tradeoffs += 2;
  if (hasSpecifics && hasTradeoffs) scores.tradeoffs += 0.5;
  if (hasPrioritization) scores.tradeoffs += 0.5;
  scores.tradeoffs = Math.min(5, Math.round(scores.tradeoffs));

  // Metrics
  scores.metrics = 1.5;
  if (hasMetrics) scores.metrics += 2;
  if (hasData) scores.metrics += 1;
  if (hasMetrics && hasSpecifics) scores.metrics += 0.5;
  scores.metrics = Math.min(5, Math.round(scores.metrics));

  // Execution
  scores.execution = 2;
  if (hasPrioritization) scores.execution += 1;
  if (hasSpecifics) scores.execution += 0.5;
  if (hasTechnical) scores.execution += 0.5;
  if (hasTradeoffs) scores.execution += 0.5;
  if (words > 80) scores.execution += 0.5;
  scores.execution = Math.min(5, Math.round(scores.execution));

  return { scores, isVague, isShallow, hasWeakAssumption, missingMetrics, missingTradeoffs, hasFramework, hasMetrics, hasTradeoffs, hasUserFocus, hasSpecifics, wordCount: words };
}

function endInterview() {
  if (APP.state.interviewEnded) return;
  APP.state.interviewEnded = true;
  clearInterval(APP.state.timerInterval);

  // Count actual candidate responses (not clarifying questions)
  const candidateAnswers = APP.state.transcript.filter(m => m.role === 'candidate');
  const substantiveAnswers = candidateAnswers.filter(m => !detectClarifyingQuestion(m.text));

  if (substantiveAnswers.length === 0) {
    // No real answers given — show insufficient data screen
    addMessage('interviewer', "You ended the interview without providing any substantive answers. There is nothing to evaluate.");
    setTimeout(() => showInsufficientData(candidateAnswers.length), 1500);
    return;
  }

  if (substantiveAnswers.length === 1) {
    addMessage('interviewer', "We barely got started. I have very limited data to work with, but I'll give you what I can.");
  } else {
    const closings = [
      "That's all the time we have. Let me put together my evaluation.",
      "We're done. I'll compile my assessment now.",
      "Time's up. I have enough to evaluate. Stand by for your results."
    ];
    addMessage('interviewer', pickRandom(closings));
  }

  setTimeout(() => showEvaluation(), 2000);
}

function showInsufficientData(clarificationCount) {
  document.getElementById('interview-screen').classList.add('hidden');
  document.getElementById('eval-screen').classList.remove('hidden');

  document.getElementById('overall-score').innerHTML = `
    <div class="big-score" style="color:var(--text-muted)">N/A</div>
    <div class="score-label">No Score — Insufficient Data</div>
    <div class="verdict">You did not provide enough answers to generate a meaningful evaluation.</div>
  `;

  document.getElementById('score-grid').innerHTML = `
    <div class="score-card" style="grid-column:1/-1;text-align:center;padding:2rem">
      <div class="dim-name" style="font-size:.9rem;margin-bottom:.75rem">No dimension scores available</div>
      <div class="score-comment">An evaluation requires at least 2-3 substantive answers to interview questions. Clarifying questions alone are not sufficient.</div>
    </div>
  `;

  const strongEl = document.getElementById('strong-signals');
  const weakEl = document.getElementById('weak-signals');
  strongEl.innerHTML = '';
  weakEl.innerHTML = '';

  if (clarificationCount > 0) {
    strongEl.innerHTML = '<div class="signal strong">You asked ' + clarificationCount + ' clarifying question(s) before the interview ended. That instinct is good — but you need to follow through with actual answers.</div>';
  }

  weakEl.innerHTML = '<div class="signal weak">The interview ended with no substantive answers. In a real interview, this would be an automatic rejection. Even a partial, imperfect answer is better than no answer.</div>';

  document.getElementById('advice-list').innerHTML = `
    <li><strong>Next time:</strong> Start answering even if you feel uncertain. Structure your thinking out loud: "Let me break this down into three parts..." Interviewers evaluate your reasoning process, not just your conclusions.</li>
    <li><strong>Clarifying questions are good, but they're the setup — not the answer.</strong> Aim to spend 1-2 minutes clarifying, then dive into your response. Don't let clarification become avoidance.</li>
  `;

  // Show transcript if any
  const reviewEl = document.getElementById('transcript-review');
  reviewEl.innerHTML = '';
  APP.state.transcript.forEach(msg => {
    reviewEl.innerHTML += `
      <div class="transcript-entry">
        <div class="te-role ${msg.role}">${msg.role === 'interviewer' ? 'Interviewer' : 'You'}</div>
        <div class="te-text">${escapeHtml(msg.text)}</div>
      </div>
    `;
  });
}

// ============================================================
// EVALUATION RENDERER
// ============================================================

function showEvaluation() {
  document.getElementById('interview-screen').classList.add('hidden');
  document.getElementById('eval-screen').classList.remove('hidden');

  // Analyze ALL candidate answers for aggregate stats
  const candidateMessages = APP.state.transcript.filter(m => m.role === 'candidate');
  const substantiveAnswers = candidateMessages.filter(m => !detectClarifyingQuestion(m.text));
  const clarifyingQs = candidateMessages.filter(m => detectClarifyingQuestion(m.text));

  // Per-answer detailed analysis for contextual feedback
  const answerAnalyses = substantiveAnswers.map(m => ({
    text: m.text,
    analysis: analyzeAnswer(m.text)
  }));

  // Calculate final scores based ONLY on actual data
  const finalScores = {};
  const hasData = {};
  EVAL_DIMENSIONS.forEach(dim => {
    const arr = APP.state.candidateScores[dim.key];
    hasData[dim.key] = arr.length > 0;
    if (arr.length > 0) {
      finalScores[dim.key] = Math.round(arr.reduce((a,b)=>a+b,0) / arr.length);
    } else {
      finalScores[dim.key] = 0; // 0 = not evaluated, not "2 by default"
    }
    finalScores[dim.key] = Math.max(0, Math.min(5, finalScores[dim.key]));
  });

  // Overall — only count dimensions with actual data
  const scoredDims = Object.values(finalScores).filter(s => s > 0);
  const overall = scoredDims.length > 0
    ? (scoredDims.reduce((a,b)=>a+b,0) / scoredDims.length).toFixed(1)
    : "N/A";

  const verdicts = {
    1: "Significant gaps. Needs fundamental practice.",
    2: "Below bar. Needs structured preparation.",
    3: "Mixed signals. Some areas solid, others need work.",
    4: "Above bar. Strong performance with minor gaps.",
    5: "Exceptional. Would advance to next round."
  };

  const verdictKey = overall === "N/A" ? 0 : Math.round(parseFloat(overall));
  const verdict = verdictKey === 0
    ? "Not enough data for a verdict. Try answering more questions."
    : verdicts[verdictKey] || verdicts[3];

  document.getElementById('overall-score').innerHTML = `
    <div class="big-score">${overall}</div>
    <div class="score-label">Overall Score (out of 5)${scoredDims.length < 6 ? ' — based on limited data' : ''}</div>
    <div class="verdict">${verdict}</div>
  `;

  // Dimension scores — show "Not evaluated" for dimensions with no data
  const grid = document.getElementById('score-grid');
  grid.innerHTML = '';

  EVAL_DIMENSIONS.forEach(dim => {
    const s = finalScores[dim.key];
    if (s === 0) {
      grid.innerHTML += `
        <div class="score-card" style="opacity:.5">
          <div class="dim-name">${dim.name}</div>
          <div class="score-bar-track"><div class="score-bar-fill" style="width:0"></div></div>
          <div class="score-val">Not evaluated — insufficient data for this dimension</div>
          <div class="score-comment">${dim.desc}</div>
        </div>
      `;
    } else {
      const scoreComments = {
        1: "Did not demonstrate this skill.",
        2: "Attempted but fell short of expectations.",
        3: "Adequate. Met basic expectations.",
        4: "Strong. Exceeded expectations in most areas.",
        5: "Exceptional. Would stand out among candidates."
      };
      grid.innerHTML += `
        <div class="score-card">
          <div class="dim-name">${dim.name}</div>
          <div class="score-bar-track"><div class="score-bar-fill s${s}"></div></div>
          <div class="score-val">${s}/5 — ${scoreComments[s]}</div>
          <div class="score-comment">${dim.desc}</div>
        </div>
      `;
    }
  });

  // CONTEXTUAL SIGNALS — derived from what actually happened
  const strongEl = document.getElementById('strong-signals');
  const weakEl = document.getElementById('weak-signals');
  strongEl.innerHTML = '';
  weakEl.innerHTML = '';

  const strongSignals = [];
  const weakSignals = [];

  // Only add signals that are backed by actual data
  const clCount = APP.state._clarificationCount || 0;
  if (clCount >= 2) {
    strongSignals.push("Asked " + clCount + " clarifying questions before diving in. This is exactly what strong candidates do — it shows you don't assume you have all the context.");
  } else if (clCount === 1) {
    strongSignals.push("Asked a clarifying question. Good instinct, but consider asking 2-3 targeted questions upfront to fully scope the problem.");
  }

  // Count aggregate patterns across all answers
  let vagueCount = 0, shallowCount = 0, frameworkCount = 0, metricsCount = 0;
  let tradeoffCount = 0, specificCount = 0, userFocusCount = 0;
  let totalWordCount = 0;

  answerAnalyses.forEach(({analysis: a}) => {
    if (a.isVague) vagueCount++;
    if (a.isShallow) shallowCount++;
    if (a.hasFramework) frameworkCount++;
    if (a.hasMetrics) metricsCount++;
    if (a.hasTradeoffs) tradeoffCount++;
    if (a.hasSpecifics) specificCount++;
    if (a.hasUserFocus) userFocusCount++;
    totalWordCount += a.wordCount;
  });

  const total = substantiveAnswers.length;
  if (total === 0) {
    // Shouldn't reach here (handled by showInsufficientData) but safety net
    weakSignals.push("No substantive answers were provided.");
  } else {
    // Contextual strong signals with specifics
    if (frameworkCount >= Math.ceil(total * 0.6)) {
      strongSignals.push("Used structured frameworks in " + frameworkCount + " of " + total + " answers. Your communication was organized and easy to follow.");
    }
    if (metricsCount >= Math.ceil(total * 0.5)) {
      strongSignals.push("Mentioned metrics in " + metricsCount + " of " + total + " answers. You consistently connected proposals to measurable outcomes.");
    }
    if (tradeoffCount >= Math.ceil(total * 0.5)) {
      strongSignals.push("Discussed trade-offs in " + tradeoffCount + " of " + total + " answers. You showed awareness that every decision has costs.");
    }
    if (userFocusCount >= Math.ceil(total * 0.5)) {
      strongSignals.push("Showed user-centric thinking in " + userFocusCount + " of " + total + " answers. You grounded your reasoning in user needs.");
    }
    if (specificCount >= Math.ceil(total * 0.6)) {
      strongSignals.push("Provided concrete specifics in " + specificCount + " of " + total + " answers. Your answers went beyond generic territory.");
    }
    if (totalWordCount / total > 120) {
      strongSignals.push("Your average answer length showed depth of thought. You took the time to develop your reasoning.");
    }

    // Contextual weak signals
    if (vagueCount >= Math.ceil(total * 0.5)) {
      weakSignals.push("" + vagueCount + " of " + total + " answers were too vague. The interviewer had to push for specifics multiple times. In a real interview, this burns time and signals unpreparedness.");
    }
    if (shallowCount >= Math.ceil(total * 0.5) && shallowCount > vagueCount) {
      weakSignals.push("" + shallowCount + " of " + total + " answers stayed surface-level. You answered the question but didn't go deep enough to differentiate yourself.");
    }
    if (metricsCount === 0 && total >= 2) {
      weakSignals.push("You never mentioned metrics across " + total + " answers. Every PM answer should connect to measurable outcomes — this is a consistent gap.");
    } else if (metricsCount < Math.ceil(total * 0.3) && total >= 3) {
      weakSignals.push("Metrics appeared in only " + metricsCount + " of " + total + " answers. Make it a habit to define success criteria in every response.");
    }
    if (tradeoffCount === 0 && total >= 2) {
      weakSignals.push("No trade-off discussion in any of your " + total + " answers. Real PMs make hard choices — show you can weigh competing options.");
    }
    if (frameworkCount === 0 && total >= 2) {
      weakSignals.push("None of your answers used a clear structure or framework. Organize your thinking before speaking — even a simple 'three dimensions' approach helps.");
    }
    if (clCount === 0 && total >= 1) {
      weakSignals.push("You never asked a clarifying question. Strong PMs clarify scope, users, and constraints before proposing solutions.");
    }
    if (totalWordCount / total < 40 && total >= 2) {
      weakSignals.push("Your answers averaged " + Math.round(totalWordCount / total) + " words each. This is too brief for a PM interview — you're not demonstrating depth.");
    }
    if (total === 1) {
      weakSignals.push("Only one substantive answer in the entire interview. A full evaluation requires sustained engagement across multiple questions.");
    }
  }

  if (strongSignals.length === 0 && total > 0) {
    strongSignals.push("No standout strengths detected in this session. That's okay — the goal is to identify gaps and improve.");
  }

  strongSignals.forEach(s => strongEl.innerHTML += `<div class="signal strong">${s}</div>`);
  weakSignals.forEach(s => weakEl.innerHTML += `<div class="signal weak">${s}</div>`);

  // CONTEXTUAL ADVICE — only for dimensions with actual data and weaknesses
  const adviceEl = document.getElementById('advice-list');
  adviceEl.innerHTML = '';
  const advice = [];

  if (total === 0) {
    advice.push("<strong>Start answering.</strong> You can't improve what you don't practice. Even a messy answer teaches you more than silence.");
  } else {
    // Advice tied to actual patterns
    if (frameworkCount < Math.ceil(total * 0.4)) {
      advice.push("<strong>Structure:</strong> In " + (total - frameworkCount) + " of your " + total + " answers, there was no clear framework. Practice: \"I'll approach this in three parts...\" before diving in. Announce your structure, then execute it.");
    }
    if (metricsCount < Math.ceil(total * 0.4)) {
      advice.push("<strong>Metrics:</strong> You mentioned metrics in only " + metricsCount + " of " + total + " answers. After every proposal, force yourself to say: \"I'd measure success by...\" and name a north star metric plus 2 supporting metrics.");
    }
    if (tradeoffCount < Math.ceil(total * 0.4)) {
      advice.push("<strong>Trade-offs:</strong> Only " + tradeoffCount + " of " + total + " answers addressed trade-offs. After presenting any recommendation, add: \"The trade-off here is...\" Proactively surfacing costs signals PM maturity.");
    }
    if (vagueCount >= Math.ceil(total * 0.3)) {
      advice.push("<strong>Specificity:</strong> " + vagueCount + " answers were flagged as vague. Replace generic statements with concrete examples: instead of \"improve the experience,\" say \"reduce the checkout flow from 5 steps to 2, targeting a 15% conversion lift.\"");
    }
    if (userFocusCount < Math.ceil(total * 0.3)) {
      advice.push("<strong>User focus:</strong> Only " + userFocusCount + " of " + total + " answers referenced users, customers, or personas. Start every answer by defining who you're solving for and what their specific pain point is.");
    }
    if (clCount === 0) {
      advice.push("<strong>Clarifying questions:</strong> You jumped straight into answering without clarifying. Next time, spend 60-90 seconds asking about scope, target users, success metrics, and constraints before proposing solutions.");
    }
    if (totalWordCount / total < 50 && total >= 2) {
      advice.push("<strong>Depth:</strong> Your answers averaged only " + Math.round(totalWordCount / total) + " words. PM interviews reward thorough, layered thinking. Aim for at least 2-3 minutes per answer with examples, metrics, and trade-offs.");
    }

    if (advice.length === 0) {
      advice.push("<strong>Overall:</strong> Solid performance across the board. To push from good to exceptional: anticipate the interviewer's next question and address it proactively. Show you're thinking two steps ahead.");
    }
  }

  advice.forEach(a => adviceEl.innerHTML += `<li>${a}</li>`);

  // Transcript review with annotations
  const reviewEl = document.getElementById('transcript-review');
  reviewEl.innerHTML = '';
  APP.state.transcript.forEach((msg, i) => {
    let annotation = '';
    if (msg.role === 'candidate') {
      const clarifyType = detectClarifyingQuestion(msg.text);
      if (clarifyType) {
        annotation = "Good: Asked a clarifying question (" + clarifyType.replace(/_/g,' ') + "). This shows problem-scoping discipline.";
      } else {
        const a = analyzeAnswer(msg.text);
        const notes = [];
        if (a.isVague) notes.push("Too vague — add specifics and examples.");
        if (a.isShallow && !a.isVague) notes.push("Surface-level — go deeper with mechanisms and reasoning.");
        if (a.missingMetrics) notes.push("No metrics mentioned.");
        if (a.missingTradeoffs) notes.push("No trade-offs discussed.");
        if (a.hasFramework) notes.push("Good: structured approach.");
        if (a.hasMetrics) notes.push("Good: included metrics.");
        if (a.hasTradeoffs) notes.push("Good: addressed trade-offs.");
        if (a.hasUserFocus) notes.push("Good: user-centric thinking.");
        if (a.hasSpecifics) notes.push("Good: concrete specifics.");
        if (notes.length > 0) annotation = notes.join(' | ');
      }
    }
    reviewEl.innerHTML += `
      <div class="transcript-entry">
        <div class="te-role ${msg.role}">${msg.role === 'interviewer' ? 'Interviewer' : 'You'}</div>
        <div class="te-text">${escapeHtml(msg.text)}</div>
        ${annotation ? `<div class="te-annotation">${annotation}</div>` : ''}
      </div>
    `;
  });
}

// ============================================================
// CHAT HELPERS
// ============================================================

function addMessage(role, text) {
  APP.state.transcript.push({ role, text, time: new Date() });

  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const now = new Date();
  const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

  div.innerHTML = `
    <div class="msg-sender">${role === 'interviewer' ? PERSONAS[APP.config.persona].name : 'You'}</div>
    <div class="msg-body">${escapeHtml(text)}</div>
    <div class="msg-time">${timeStr}</div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.id = 'typing';
  div.className = 'msg interviewer';
  div.innerHTML = `
    <div class="msg-sender">${PERSONAS[APP.config.persona].name}</div>
    <div class="typing-indicator"><span></span><span></span><span></span></div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function resetApp() {
  // Reset state
  APP.config = { company: null, seniority: null, type: null, persona: 'neutral', stressMode: false };
  APP.state = {
    screen: 'setup',
    transcript: [],
    questionIndex: 0,
    followUpCount: 0,
    maxFollowUps: 0,
    timerSeconds: 0,
    timerInterval: null,
    interviewStarted: false,
    interviewEnded: false,
    currentQuestion: null,
    candidateScores: { problem_framing:[], depth:[], structure:[], tradeoffs:[], metrics:[], execution:[] },
    difficultyLevel: 2,
    totalExchanges: 0,
    questionHistory: [],
    usedQuestionKeys: new Set()
  };

  // Reset UI
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.persona-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector('.persona-btn[data-value="neutral"]').classList.add('selected');
  document.getElementById('stress-toggle').classList.remove('on');
  document.getElementById('start-btn').disabled = true;
  document.getElementById('chat-area').innerHTML = '';
  document.getElementById('user-input').value = '';
  document.getElementById('timer').className = 'timer';

  // Show setup
  document.getElementById('eval-screen').classList.add('hidden');
  document.getElementById('interview-screen').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
}
